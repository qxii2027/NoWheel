<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill controls — NoWheel</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4f1;
    --panel: #ffffff;
    --ink: #17181c;
    --muted: #6b6f76;
    --line: #e4e2dd;
    --accent: #0f7a5a;
    --accent-soft: #e3f2eb;
    --off: #a9aaad;
    --shadow: 0 1px 2px rgba(20, 22, 26, .05), 0 14px 34px -20px rgba(20, 22, 26, .35);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101114;
      --panel: #17191d;
      --ink: #f2f1ee;
      --muted: #9a9da4;
      --line: #292c32;
      --accent: #4ad6a4;
      --accent-soft: rgba(74, 214, 164, .12);
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 18px 42px -22px rgba(0, 0, 0, .85);
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(58rem 38rem at 82% -12%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 62%);
  }
  .shell {
    position: relative;
    max-width: 1020px;
    margin: 0 auto;
    padding: 68px 28px 44px;
  }
  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 36px;
    margin-bottom: 38px;
  }
  .eyebrow {
    margin: 0 0 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .17em;
    color: var(--muted);
  }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(26px, 3.4vw, 40px);
    line-height: 1.08;
    letter-spacing: -.022em;
    font-weight: 650;
  }
  .lede {
    margin: 0;
    max-width: 58ch;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.62;
  }
  .counter {
    flex: none;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    white-space: nowrap;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(272px, 1fr));
    gap: 16px;
  }
  .card {
    display: flex;
    flex-direction: column;
    min-height: 238px;
    padding: 21px 21px 17px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    transition: opacity .2s ease, transform .2s ease, border-color .2s ease;
  }
  .card:hover { transform: translateY(-1px); }
  .card.is-off { background: color-mix(in srgb, var(--panel) 74%, var(--bg)); }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 19px;
  }
  .rule {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .15em;
    color: var(--muted);
  }
  h2 {
    margin: 0 0 8px;
    font-size: 17px;
    letter-spacing: -.012em;
    font-weight: 620;
  }
  .desc {
    flex: 1;
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.58;
  }
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 13px;
    border-top: 1px solid var(--line);
  }
  .state {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .card.is-off .state { color: var(--muted); }
  .tool {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
  }
  .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--off);
    transition: transform .18s ease, background .18s ease;
  }
  .switch[aria-checked="true"] {
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 46%, var(--line));
  }
  .switch[aria-checked="true"] .knob {
    transform: translateX(20px);
    background: var(--accent);
  }
  .switch:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    margin-top: 30px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .path { overflow-wrap: anywhere; }
  .save { color: var(--accent); min-height: 1em; }
  .save.error { color: #d4574e; }
  .notice {
    grid-column: 1 / -1;
    margin: 0;
    padding: 18px 20px;
    border: 1px dashed var(--line);
    border-radius: 14px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  code {
    font-family: var(--mono);
    font-size: .95em;
    padding: 1px 5px;
    border-radius: 5px;
    background: color-mix(in srgb, var(--ink) 7%, transparent);
  }
  @media (max-width: 640px) {
    .shell { padding: 42px 20px 34px; }
    .head { flex-direction: column; gap: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="head">
    <div>
      <p class="eyebrow">SKILL CONTROLS</p>
      <h1>NoWheel</h1>
      <p class="lede">Three rules for interfaces, icons, and open-source reuse. Changes apply the next time an agent starts a task.</p>
    </div>
    <div class="counter" id="counter" aria-live="polite">—</div>
  </header>

  <section class="grid" id="grid" aria-busy="true"></section>

  <footer class="foot">
    <span class="path" id="path">skill.config.json</span>
    <span class="save" id="save" role="status"></span>
  </footer>
</main>

<template id="card">
  <article class="card">
    <div class="top">
      <span class="rule"></span>
      <button class="switch" type="button" role="switch" aria-checked="false">
        <span class="knob"></span>
      </button>
    </div>
    <h2></h2>
    <p class="desc"></p>
    <div class="bottom">
      <span class="state"></span>
      <span class="tool"></span>
    </div>
  </article>
</template>

<script>
  const grid = document.getElementById('grid');
  const counter = document.getElementById('counter');
  const pathEl = document.getElementById('path');
  const saveEl = document.getElementById('save');
  const template = document.getElementById('card');

  let features = [];
  let savedTimer;

  function announce(text, isError = false) {
    saveEl.textContent = text;
    saveEl.classList.toggle('error', isError);
    clearTimeout(savedTimer);
    if (!isError) {
      savedTimer = setTimeout(() => { saveEl.textContent = ''; }, 2400);
    }
  }

  function updateCounter() {
    const on = features.filter((feature) => feature.enabled).length;
    counter.textContent = `${on} / ${features.length} on`;
  }

  function applyState(node, button, feature) {
    node.classList.toggle('is-off', !feature.enabled);
    button.setAttribute('aria-checked', String(feature.enabled));
    button.setAttribute('aria-label', `${feature.title}: ${feature.enabled ? 'on' : 'off'}`);
    node.querySelector('.state').textContent = feature.enabled ? 'On' : 'Off';
  }

  async function toggle(feature, node, button) {
    const next = !feature.enabled;
    feature.enabled = next;
    applyState(node, button, feature);
    updateCounter();

    try {
      const response = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: feature.id, enabled: next }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      announce('Saved');
    } catch {
      feature.enabled = !next;
      applyState(node, button, feature);
      updateCounter();
      announce('Save failed — is the panel server still running?', true);
    }
  }

  function render() {
    grid.textContent = '';
    for (const feature of features) {
      const node = template.content.firstElementChild.cloneNode(true);
      node.dataset.feature = feature.id;
      node.querySelector('.rule').textContent = feature.rule;
      node.querySelector('h2').textContent = feature.title;
      node.querySelector('.desc').textContent = feature.description;
      node.querySelector('.tool').textContent = feature.tool;
      const button = node.querySelector('.switch');
      applyState(node, button, feature);
      button.addEventListener('click', () => toggle(feature, node, button));
      grid.append(node);
    }
    grid.setAttribute('aria-busy', 'false');
    updateCounter();
  }

  async function load() {
    try {
      const response = await fetch('/api/config', { cache: 'no-store' });
      if (!response.ok) throw new Error();
      const data = await response.json();
      features = data.features;
      pathEl.textContent = data.configPath;
      render();
    } catch {
      grid.setAttribute('aria-busy', 'false');
      grid.textContent = '';
      const notice = document.createElement('p');
      notice.className = 'notice';
      notice.append('Cannot reach the control server. Start it with ');
      const code = document.createElement('code');
      code.textContent = 'node scripts/control.mjs';
      notice.append(code, '.');
      grid.append(notice);
    }
  }

  load();
</script>
</body>
</html>
